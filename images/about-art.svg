<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgAbout" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#181c3a"/>
      <stop offset="1" stop-color="#0a0c16"/>
    </radialGradient>
    <linearGradient id="goldAbout" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd48c"/>
      <stop offset="1" stop-color="#c9a24b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bgAbout)"/>

  <!-- faint diamond lattice -->
  <g stroke="#c9a24b" stroke-width="1" opacity="0.07">
    <path d="M0 60 400 460 M0 140 400 540 M0 -20 400 380 M400 60 0 460 M400 140 0 540 M400 -20 0 380"/>
  </g>

  <!-- desk line -->
  <line x1="55" y1="290" x2="345" y2="290" stroke="url(#goldAbout)" stroke-width="1.4" opacity="0.6"/>

  <!-- laptop -->
  <g stroke="url(#goldAbout)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="140" y="150" width="120" height="80" rx="4"/>
    <path d="M118 262 L282 262 L268 232 L132 232 Z"/>
    <line x1="118" y1="262" x2="282" y2="262"/>
  </g>
  <!-- code lines on the screen -->
  <g stroke="url(#goldAbout)" stroke-width="1.4" opacity="0.85" stroke-linecap="round">
    <line x1="155" y1="168" x2="205" y2="168"/>
    <line x1="155" y1="180" x2="235" y2="180"/>
    <line x1="165" y1="192" x2="220" y2="192"/>
    <line x1="155" y1="204" x2="195" y2="204"/>
  </g>

  <!-- coffee cup -->
  <g stroke="url(#goldAbout)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M292 236 h34 v22 a17 17 0 0 1 -17 17 h0 a17 17 0 0 1 -17 -17 z"/>
    <path d="M326 242 q12 -2 12 8 q0 10 -12 9"/>
    <path d="M300 224 q3 -8 0 -14 M312 224 q3 -8 0 -14" opacity="0.6"/>
  </g>

  <!-- small plant -->
  <g stroke="url(#goldAbout)" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M64 290 v-18 a14 12 0 0 1 28 0 v18 z"/>
    <path d="M78 272 q0 -20 -14 -30 M78 272 q0 -24 14 -32 M78 272 v-18"/>
  </g>

  <!-- gold accent dots -->
  <g fill="#c9a24b">
    <circle cx="345" cy="80" r="2"/>
    <circle cx="60" cy="110" r="1.6"/>
    <circle cx="330" cy="330" r="1.8"/>
  </g>
</svg>
