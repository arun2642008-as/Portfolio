<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgHero" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#171b38"/>
      <stop offset="1" stop-color="#0a0c16"/>
    </radialGradient>
    <linearGradient id="goldHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd48c"/>
      <stop offset="1" stop-color="#c9a24b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bgHero)"/>

  <!-- diamond lattice, faint -->
  <g stroke="#c9a24b" stroke-width="1" opacity="0.08">
    <path d="M0 60 400 460 M0 140 400 540 M0 -20 400 380 M400 60 0 460 M400 140 0 540 M400 -20 0 380"/>
  </g>

  <!-- concentric rings -->
  <circle cx="200" cy="210" r="165" fill="none" stroke="#c9a24b" stroke-width="1" opacity="0.18"/>
  <circle cx="200" cy="210" r="130" fill="none" stroke="#c9a24b" stroke-width="1" opacity="0.12"/>

  <!-- abstract bust silhouette -->
  <g stroke="url(#goldHero)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="200" cy="160" r="52"/>
    <path d="M96 356 Q100 240 200 228 Q300 240 304 356"/>
  </g>

  <!-- code glyph resting on the chest, standing in for the craft -->
  <text x="200" y="300" font-family="Cinzel, serif" font-size="30" letter-spacing="2"
        fill="url(#goldHero)" text-anchor="middle" opacity="0.9">&lt;/&gt;</text>

  <!-- scattered accent points -->
  <g fill="#c9a24b">
    <circle cx="70" cy="90" r="2"/>
    <circle cx="335" cy="120" r="1.6"/>
    <circle cx="60" cy="300" r="1.6"/>
    <circle cx="345" cy="290" r="2.2"/>
    <circle cx="200" cy="45" r="1.6"/>
  </g>
</svg>
