<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking</title>

    <link rel="stylesheet" href="travel.css">
</head>

<body>
    <section class="main">

        <nav class="navbar">

            <ul class="nav-links">
                <li><a href="#">ACCOMMODATIONS</a></li>
                <li><a href="#">FLIGHTS</a></li>
                <li><a href="#">CAR RENTALS</a></li>
                <li><a href="#">AIRPORT TAXIS</a></li>
            </ul>


            <div class="social-icons">
                <a href="#">f</a>
                <a href="#">t</a>
                <a href="#">in</a>
                <a href="#">ig</a>
            </div>

        </nav>

        <div class="content">

            <!-- LEFT SIDE -->

            <div class="left">

                <img src="travel img/travel 1.png" alt="Plane">

            </div>

            <div class="right">

                <h1>
                    BOOK <br>
                    & TRAVEL
                </h1>

                <p>
                    Wherever you go, make yourself at home
                </p>

                <div class="booking-box">

                    <form>

                        <label>DESTINATION</label>
                        <input type="text" placeholder="Paris, France">


                        <div class="date-box">

                            <div>
                                <label>CHECK-IN DATE</label>
                                <input type="date">
                            </div>

                            <div>
                                <label>CHECK-OUT DATE</label>
                                <input type="date">
                            </div>

                        </div>



                        <div class="people-box">

                            <div>
                                <label>ADULTS</label>
                                <input type="number">
                            </div>

                            <div>
                                <label>CHILDREN</label>
                                <input type="number">
                            </div>

                        </div>


                        <button type="submit">
                            START SEARCH
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </section>

</body>
</html>
